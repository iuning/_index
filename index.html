<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>起始页</title>

    <!-- TailwindCSS + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="icon"
      href="https://www.ilovepdf.com/img/favicons-pdf/favicon-32x32.png"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: [
                '"SF Pro Display"',
                "-apple-system",
                "BlinkMacSystemFont",
                '"Helvetica Neue"',
                "Arial",
                "sans-serif",
              ],
            },
            boxShadow: {
              apple: "0 8px 32px rgba(0, 0, 0, 0.08)",
              "apple-hover": "0 12px 48px rgba(0, 0, 0, 0.16)",
              "apple-card": "0 4px 24px rgba(0,0,0,0.06)",
            },
          },
        },
      };
    </script>

    <style type="text/tailwindcss">
      @layer utilities {
        .glass-panel {
          @apply bg-white/45 dark:bg-black/50 backdrop-blur-2xl border border-white/60 dark:border-white/10 shadow-apple text-gray-800 dark:text-gray-100 transition-all duration-300 rounded-[32px];
        }
        .glass-panel-hover {
          @apply hover:bg-white/55 dark:hover:bg-black/60 hover:shadow-apple-hover dark:hover:border-white/20 hover:border-white/90;
        }
        .glass-input {
          @apply bg-white/60 dark:bg-black/50 border border-white/60 dark:border-white/10 rounded-2xl focus:outline-none focus:ring-4 focus:ring-blue-400/30 text-gray-800 dark:text-gray-100 transition-all placeholder-gray-500 dark:placeholder-gray-400 shadow-sm;
        }
        .glass-modal {
          @apply bg-white/85 dark:bg-gray-900/85 backdrop-blur-3xl border border-white/70 dark:border-white/10 shadow-2xl rounded-[32px] text-gray-800 dark:text-gray-100;
        }
        .standalone-text {
          @apply text-gray-800 dark:text-white transition-colors duration-500;
        }
      }

      body {
        background-color: #f5f5f7;
        background-size: cover !important;
        background-position: center !important;
        background-attachment: fixed !important;
        background-repeat: no-repeat !important;
        transition: background 0.3s ease;
      }

      .dark body {
        background-color: #121212;
      }

      body.has-pic::after {
        content: "";
        position: fixed;
        inset: 0;
        @apply bg-black/10 dark:bg-black/50 backdrop-blur-[1px] transition-colors duration-500;
        z-index: -1;
        pointer-events: none;
      }

      body.has-pic .standalone-text {
        @apply text-white;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      }
      .dark body.has-pic .standalone-text {
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
      }

      .preset-ring {
        @apply ring-offset-gray-100 dark:ring-offset-gray-900;
      }
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      .dropdown-origin {
        transform-origin: top center;
      }
      .scroolbar-hide::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>

  <body
    class="antialiased min-h-screen overflow-x-hidden flex flex-col pt-[5vh] pb-12 transition-colors duration-500 z-0 relative"
  >
    <div
      class="flex flex-col w-full max-w-4xl mx-auto px-4 sm:px-6 z-10 justify-start h-full gap-8"
    >
      <!-- 时间模块 -->
      <div
        id="timeModule"
        class="flex flex-col items-center justify-center z-10 w-full select-none mt-6"
      >
        <div
          id="timeDisplay"
          class="standalone-text text-[4.5rem] md:text-[6.5rem] lg:text-[7.5rem] tabular-nums font-bold tracking-tight leading-none mb-3 flex items-end"
        >
          <span id="hm">00:00</span>
          <span
            id="s"
            class="text-[2.2rem] md:text-[3rem] lg:text-[3.5rem] font-semibold opacity-80 ml-2 mb-2 md:mb-3"
            >:00</span
          >
        </div>
        <div
          id="dateDisplay"
          class="standalone-text text-base md:text-[19px] font-semibold tracking-wider mt-1"
        >
          1月1日 星期一
        </div>
      </div>

      <!-- 搜索模块 -->
      <div
        id="searchModule"
        class="relative w-full max-w-2xl mx-auto z-40 mb-2"
      >
        <div
          class="glass-panel !rounded-full flex items-center h-[60px] pl-2 pr-2.5 w-full relative group shadow-apple"
        >
          <button
            id="engineBtn"
            class="flex items-center justify-center gap-1.5 h-11 px-4 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors"
          >
            <i
              id="engineIcon"
              class="fa-brands fa-microsoft text-blue-500 text-[20px] transition-transform group-hover:scale-110"
            ></i>
            <i class="fa-solid fa-angle-down text-[11px] opacity-40 ml-1"></i>
          </button>
          <div
            id="engineDropdown"
            class="absolute top-[70px] left-3 w-36 glass-panel !rounded-[24px] p-2 opacity-0 invisible scale-95 dropdown-origin transition-all z-50"
          >
            <button
              data-engine="bing"
              class="engine-option w-full flex items-center gap-3 px-4 py-3 rounded-xl text-[15px] font-medium hover:bg-black/5 dark:hover:bg-white/10 transition"
            >
              <i class="fa-brands fa-microsoft text-blue-500 text-[18px]"></i>
              Bing
            </button>
            <button
              data-engine="google"
              class="engine-option w-full flex items-center gap-3 px-4 py-3 rounded-xl text-[15px] font-medium hover:bg-black/5 dark:hover:bg-white/10 transition"
            >
              <i class="fa-brands fa-google text-red-500 text-[18px]"></i>
              Google
            </button>
          </div>
          <input
            type="text"
            id="searchInput"
            class="flex-1 bg-transparent border-none outline-none text-[18px] px-4 w-full font-medium placeholder-gray-400 dark:placeholder-gray-500"
            placeholder=""
            autocomplete="off"
            autofocus
          />
          <button
            id="searchSubmit"
            class="h-11 w-11 flex items-center justify-center rounded-full bg-blue-500 hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-500 text-white shadow-lg shrink-0 ml-1"
          >
            <i class="fa-solid fa-magnifying-glass text-[16px]"></i>
          </button>
        </div>
      </div>

      <!-- 天气模块 - 改用国内稳定API -->
      <div class="w-full relative group">
        <div
          class="glass-panel glass-panel-hover p-6 md:p-8 flex flex-col md:flex-row justify-between items-center gap-6 relative overflow-hidden transition-all duration-300 min-h-[150px]"
        >
          <button
            id="weatherEditBtn"
            class="absolute top-5 right-5 text-gray-400 dark:text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 hover:-rotate-45 transition-all z-20 p-2"
          >
            <i class="fa-solid fa-cog text-[18px]"></i>
          </button>
          <div
            id="weatherEditOverlay"
            class="absolute inset-0 z-30 backdrop-blur-3xl bg-white/80 dark:bg-black/80 opacity-0 invisible transition-all flex flex-col items-center justify-center p-6 rounded-[32px]"
          >
            <p class="text-[16px] font-bold mb-4">更新天气位置</p>
            <input
              type="text"
              id="weatherCityInput"
              class="glass-input w-full max-w-sm px-5 py-3 text-[15px] mb-5 text-center font-medium"
              placeholder="例如：北京 或 上海"
            />
            <div class="flex gap-3 w-full max-w-sm">
              <button
                id="weatherEditCancel"
                class="flex-1 py-3 rounded-xl bg-gray-200/60 dark:bg-white/10 hover:bg-gray-300/60 font-bold transition text-[15px]"
              >
                取消
              </button>
              <button
                id="weatherEditConfirm"
                class="flex-1 py-3 rounded-xl bg-blue-500 text-white font-bold transition text-[15px] shadow-md shadow-blue-500/20"
              >
                确认定位
              </button>
            </div>
          </div>
          <div
            id="weatherContent"
            class="flex flex-col md:flex-row w-full h-full z-10 transition-opacity duration-300 items-center justify-center py-1 px-2"
          >
            <i class="fa-solid fa-spinner fa-spin text-3xl opacity-50"></i>
          </div>
        </div>
      </div>

      <!-- 快捷访问聚合区 -->
      <div class="w-full relative z-20">
        <div
          class="glass-panel glass-panel-hover p-8 md:p-10 min-h-[240px] flex items-center justify-center"
        >
          <div
            id="shortcutGrid"
            class="flex flex-wrap justify-center gap-x-8 sm:gap-x-10 gap-y-10 w-full min-w-[280px]"
          ></div>
        </div>
      </div>
    </div>

    <!-- 浮动控制按钮 -->
    <div class="fixed bottom-8 right-8 flex flex-col gap-4 z-50">
      <button
        id="themeToggleBtn"
        class="w-[50px] h-[50px] glass-panel !rounded-full flex items-center justify-center hover:scale-110 !transition-transform duration-300 cursor-pointer backdrop-blur-xl"
      >
        <i
          class="fa-solid fa-moon text-[20px] text-indigo-500 dark:text-yellow-400"
        ></i>
      </button>
      <button
        id="settingsFab"
        class="w-[50px] h-[50px] glass-panel !rounded-full flex items-center justify-center hover:rotate-90 !transition-transform duration-300 cursor-pointer backdrop-blur-xl text-gray-500 dark:text-gray-300"
      >
        <i class="fa-solid fa-sliders text-[20px]"></i>
      </button>
    </div>

    <!-- 高级设置弹窗 -->
    <div
      id="settingsModal"
      class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/30 dark:bg-black/50 backdrop-blur-sm transition-opacity duration-300 px-4"
    >
      <div
        class="glass-modal w-full max-w-[360px] p-8 transform scale-95 opacity-0 transition-all duration-300"
      >
        <div class="flex justify-between items-center mb-8">
          <h3 class="text-[22px] font-bold tracking-tight">个性化壁纸</h3>
          <button
            id="closeSettings"
            class="text-gray-500 dark:text-gray-300 transition bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center -mr-1"
          >
            <i class="fa-solid fa-xmark text-[16px]"></i>
          </button>
        </div>
        <div class="space-y-6">
          <div>
            <label
              class="flex items-center gap-3 p-3.5 -mx-1 rounded-2xl hover:bg-black/5 dark:hover:bg-white/10 cursor-pointer transition"
              ><input
                type="radio"
                name="bgChoice"
                value="bing"
                class="w-[18px] h-[18px] text-blue-500 bg-black/10 dark:bg-white/5 border-transparent rounded-full focus:ring-blue-500"
              /><span class="font-bold text-[16px]"
                ><i class="fa-regular fa-image text-blue-500 mr-2"></i>
                必应每日自动壁纸</span
              ></label
            >
          </div>
          <div class="h-px w-full bg-black/5 dark:bg-white/10 my-1"></div>
          <div class="px-2">
            <span
              class="block text-[13px] font-bold text-gray-400 dark:text-gray-500 mb-4 uppercase tracking-widest pl-1"
              >精选氛围色带</span
            >
            <div class="flex gap-4 items-center" id="bgPresetContainer"></div>
          </div>
          <div class="h-px w-full bg-black/5 dark:bg-white/10 my-1 mt-5"></div>
          <div class="px-2 mb-2">
            <span
              class="block text-[13px] font-bold text-gray-400 dark:text-gray-500 mb-4 uppercase tracking-widest pl-1"
              >专属相册</span
            ><label
              class="flex items-center gap-3 p-2 -ml-3 rounded-2xl hover:bg-black/5 dark:hover:bg-white/10 cursor-pointer transition w-full"
              ><input
                type="radio"
                name="bgChoice"
                value="local"
                class="w-[18px] h-[18px] text-blue-500 bg-black/10 dark:bg-white/5 border-transparent rounded-full focus:ring-blue-500"
              /><span class="font-bold text-[16px]"
                >载入本机图像存放点</span
              ></label
            ><button
              id="btnBgUpload"
              class="hidden w-full mt-3 bg-blue-50 dark:bg-white/10 hover:bg-blue-100 dark:hover:bg-white/20 text-blue-600 dark:text-white py-3 rounded-2xl text-[15px] transition flex items-center justify-center gap-2 font-bold shadow-sm"
            >
              浏览系统目录...</button
            ><input
              type="file"
              id="bgFileInputHidden"
              class="hidden"
              accept="image/jpeg,image/png,image/webp"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- 快捷方式编辑弹窗 -->
    <div
      id="shortcutModal"
      class="fixed inset-0 z-[60] hidden flex items-center justify-center px-4 bg-black/30 dark:bg-black/50 backdrop-blur-sm transition-opacity duration-300"
    >
      <div
        class="glass-modal w-full max-w-[340px] p-7 transform scale-95 opacity-0 transition-all duration-300"
      >
        <h3 id="scModalTitle" class="text-xl font-bold mb-6">添加书签</h3>
        <div class="space-y-4">
          <div>
            <label
              class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2 ml-1 uppercase tracking-wider"
              >显示名</label
            ><input
              type="text"
              id="scName"
              class="glass-input w-full px-4 py-2.5 text-[15px]"
              placeholder="例如：豆瓣电影"
            />
          </div>
          <div>
            <label
              class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2 ml-1 uppercase tracking-wider"
              >指向链接</label
            ><input
              type="text"
              id="scUrl"
              class="glass-input w-full px-4 py-2.5 text-[15px]"
              placeholder="douban.com"
            />
          </div>
          <div>
            <label
              class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2 ml-1 uppercase tracking-wider"
              >图标素材 (Emoji / FA / 图片链接)</label
            ><input
              type="text"
              id="scIcon"
              class="glass-input w-full px-4 py-2.5 text-[15px]"
              placeholder="如：🎬, fa-solid fa-film, 图片地址"
            />
          </div>
          <div>
            <label
              class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2 ml-1 uppercase tracking-wider"
              >主涂装色</label
            ><input
              type="color"
              id="scColor"
              value="#00a1d6"
              class="w-full h-10 rounded-[12px] cursor-pointer border-0 bg-transparent p-0 overflow-hidden shadow-sm"
            />
          </div>
        </div>
        <div class="mt-8 flex justify-end gap-3 w-full">
          <button
            id="scCancel"
            class="flex-1 py-2.5 rounded-xl btn-cancel bg-gray-100 dark:bg-white/10 hover:bg-gray-200 dark:hover:bg-white/20 font-bold transition text-[15px]"
          >
            取消</button
          ><button
            id="scSave"
            class="flex-1 py-2.5 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-bold transition text-[15px] shadow-md shadow-blue-500/20"
          >
            保存
          </button>
        </div>
      </div>
    </div>

    <script>
      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => document.querySelectorAll(selector);

      const Store = {
        get(key, defaultVal) {
          try {
            return localStorage.getItem(key)
              ? JSON.parse(localStorage.getItem(key))
              : defaultVal;
          } catch {
            return defaultVal;
          }
        },
        set(key, val) {
          localStorage.setItem(key, JSON.stringify(val));
        },
      };

      const ColorUtils = {
        adjust(color, amount) {
          return (
            "#" +
            color
              .replace(/^#/, "")
              .replace(/../g, (color) =>
                (
                  "0" +
                  Math.min(
                    255,
                    Math.max(0, parseInt(color, 16) + amount),
                  ).toString(16)
                ).substr(-2),
              )
          );
        },
        hexToRgb(hex) {
          var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
          return result
            ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}`
            : "0,0,0";
        },
      };

      // 主题模块
      const ThemeModule = {
        init() {
          this.btn = $("#themeToggleBtn");
          this.icon = this.btn.querySelector("i");
          const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          this.isDark = Store.get("ntpThemeDark", prefersDark);
          this.apply();
          this.btn.addEventListener("click", () => {
            this.isDark = !this.isDark;
            Store.set("ntpThemeDark", this.isDark);
            this.apply();
          });
        },
        apply() {
          if (this.isDark) {
            document.documentElement.classList.add("dark");
            this.icon.className = "fa-solid fa-sun text-[20px] text-yellow-400";
          } else {
            document.documentElement.classList.remove("dark");
            this.icon.className =
              "fa-solid fa-moon text-[20px] text-indigo-500";
          }
        },
      };

      // 时钟模块
      const TimeModule = {
        init() {
          this.hmEl = $("#hm");
          this.sEl = $("#s");
          this.dateEl = $("#dateDisplay");
          this.days = [
            "星期日",
            "星期一",
            "星期二",
            "星期三",
            "星期四",
            "星期五",
            "星期六",
          ];
          this.update();
          setInterval(() => this.update(), 1000);
        },
        update() {
          const now = new Date();
          this.hmEl.textContent = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
          this.sEl.textContent = `:${String(now.getSeconds()).padStart(2, "0")}`;
          this.dateEl.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日    ${this.days[now.getDay()]}`;
        },
      };

      // 搜索模块
      const SearchModule = {
        engines: {
          bing: {
            url: "https://www.bing.com/search?q=",
            icon: "fa-brands fa-microsoft",
            colorUrl: "text-blue-500",
          },
          google: {
            url: "https://www.google.com/search?q=",
            icon: "fa-brands fa-google",
            colorUrl: "text-red-500",
          },
        },
        init() {
          this.current = Store.get("ntpSearchEngine", "bing");
          this.input = $("#searchInput");
          this.btn = $("#searchSubmit");
          this.dropdownBtn = $("#engineBtn");
          this.dropdownMenu = $("#engineDropdown");
          this.icon = $("#engineIcon");
          this.updateUI();
          this.bindEvents();
        },
        updateUI() {
          this.icon.className = `${this.engines[this.current].icon} ${this.engines[this.current].colorUrl} text-[20px] transition-transform group-hover:scale-110`;
          $$(".engine-option").forEach((el) => {
            if (el.dataset.engine === this.current)
              el.classList.add("bg-black/5", "dark:bg-white/10");
            else el.classList.remove("bg-black/5", "dark:bg-white/10");
          });
        },
        bindEvents() {
          this.dropdownBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            this.dropdownMenu.classList.toggle("opacity-0");
            this.dropdownMenu.classList.toggle("invisible");
            this.dropdownMenu.classList.toggle("scale-95");
          });
          document.addEventListener("click", () => {
            this.dropdownMenu.classList.add(
              "opacity-0",
              "invisible",
              "scale-95",
            );
          });
          $$(".engine-option").forEach((el) => {
            el.addEventListener("click", (e) => {
              this.current = e.currentTarget.dataset.engine;
              Store.set("ntpSearchEngine", this.current);
              this.updateUI();
            });
          });
          const executeSearch = () => {
            const q = this.input.value.trim();
            if (q) {
              window.open(
                this.engines[this.current].url + encodeURIComponent(q),
                "_blank",
              );
              this.input.value = "";
            }
          };
          this.btn.addEventListener("click", executeSearch);
          this.input.addEventListener(
            "keydown",
            (e) => e.key === "Enter" && executeSearch(),
          );
        },
      };

      // 天气模块 - 使用 uapis.cn 接口（国内稳定，无需注册）
      const WeatherModule = {
        init() {
          this.city = Store.get("ntpCity", "北京");
          this.contentEl = $("#weatherContent");
          this.editOverlay = $("#weatherEditOverlay");
          this.input = $("#weatherCityInput");
          this.bindEvents();
          this.fetchWeather(this.city);
        },

        // 根据天气描述映射emoji
        getWeatherEmoji(weatherText) {
          const text = weatherText || "";
          if (text.includes("晴")) return "☀️";
          if (text.includes("多云") || text.includes("少云")) return "⛅";
          if (text.includes("阴")) return "☁️";
          if (text.includes("小雨") || text.includes("阵雨")) return "🌦️";
          if (text.includes("中雨")) return "🌧️";
          if (text.includes("大雨") || text.includes("暴雨")) return "⛈️";
          if (text.includes("雪")) return "❄️";
          if (text.includes("雷")) return "⛈️";
          if (text.includes("雾") || text.includes("霾")) return "🌫️";
          return "🌤️";
        },

        bindEvents() {
          $("#weatherEditBtn").addEventListener("click", () => {
            this.input.value = this.city;
            this.editOverlay.classList.remove("opacity-0", "invisible");
            this.input.focus();
          });
          $("#weatherEditCancel").addEventListener("click", () => {
            this.editOverlay.classList.add("opacity-0", "invisible");
          });
          const save = () => {
            const newCity = this.input.value.trim();
            if (newCity) {
              this.city = newCity;
              Store.set("ntpCity", newCity);
              this.editOverlay.classList.add("opacity-0", "invisible");
              this.fetchWeather(newCity);
            }
          };
          $("#weatherEditConfirm").addEventListener("click", save);
          this.input.addEventListener(
            "keydown",
            (e) => e.key === "Enter" && save(),
          );
        },

        async fetchWeather(cityName) {
          if (!cityName) cityName = "北京";
          this.contentEl.style.opacity = "0.3";
          try {
            // 调用新API：获取实时天气 + 扩展字段 + 7天预报
            const url = `https://uapis.cn/api/v1/misc/weather?city=${encodeURIComponent(cityName)}&extended=true&forecast=true`;
            const resp = await fetch(`https://cors.eu.org/${url}`);
            const data = await resp.json();

            // 检查响应状态（接口成功时直接返回天气数据，无code字段表示成功）
            if (!data || !data.city) {
              throw new Error(
                data.message || "未找到该城市，试试输入“北京”、“上海”等中文名",
              );
            }

            const cityDisplay = data.city;
            const currentTemp = data.temperature;
            const weatherDesc = data.weather;
            const humidity = data.humidity || "--";
            const windScale = data.wind_scale || "微风";
            const feelsLike = data.feels_like;
            const uvIndex = data.uv_index;
            const visibility = data.visibility;
            const emoji = this.getWeatherEmoji(weatherDesc);

            // 扩展信息显示（体感温度 + 紫外线）
            const extraInfo =
              `${feelsLike ? `体感${feelsLike}°` : ""}${uvIndex ? ` · UV${uvIndex}` : ""}${visibility ? ` · 能见度${visibility}km` : ""}`.replace(
                /^ · /,
                "",
              );

            // 处理未来5天预报（forecast数组）
            let forecasts = [];
            if (data.forecast && Array.isArray(data.forecast)) {
              const futureDays = data.forecast.slice(1, 6); // 取明天开始的后5天
              for (let day of futureDays) {
                if (!day) continue;
                const date = new Date(day.date);
                const dayName = [
                  "周日",
                  "周一",
                  "周二",
                  "周三",
                  "周四",
                  "周五",
                  "周六",
                ][date.getDay()];
                const high = day.temp_max;
                const low = day.temp_min;
                const dayWeather = day.weather_day || day.weather || "";
                const fEmoji = this.getWeatherEmoji(dayWeather);
                forecasts.push({
                  day: dayName,
                  emoji: fEmoji,
                  high: high,
                  low: low,
                });
              }
            }

            // 补齐到5天
            while (forecasts.length < 5) {
              forecasts.push({ day: "--", emoji: "☁️", high: "--", low: "--" });
            }

            this.render(
              cityDisplay,
              currentTemp,
              weatherDesc,
              emoji,
              humidity,
              windScale,
              extraInfo,
              forecasts,
            );
          } catch (err) {
            this.contentEl.innerHTML = `<div class="w-full flex flex-col items-center justify-center text-[15px] font-bold gap-3 pb-2"><i class="fa-solid fa-cloud-bolt text-[42px] mb-2 opacity-50"></i><span class="opacity-80">⚠️ ${err.message || "天气获取失败，试试其他城市名"}</span></div>`;
          } finally {

          }
        },

          this.uploadBtn = $("#btnBgUpload");
          this.hiddenFileInput = $("#bgFileInputHidden");
          this.mode = Store.get("ntpBgMode", "bing");
          this.currentBlobUrl = null; // 用于释放旧URL
          this.renderPresets();
          this.applyBackground();
          this.syncUI();
          this.bindEvents();
        },

        // 压缩图片并返回 Base64（最大宽度 1920，质量 0.7）
        compressImage(file) {
          return new Promise((resolve, reject) => {
            if (!file.type.match("image.*")) {
              reject(new Error("请选择图片文件"));
              return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
              const img = new Image();
              img.onload = () => {
                const maxWidth = 1920;
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                  height = (height * maxWidth) / width;
                  width = maxWidth;
                }
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                // 转为 JPEG，质量 0.7
                const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);
                resolve(compressedBase64);
              };
              img.onerror = () => reject(new Error("图片加载失败"));
              img.src = e.target.result;
            };
            reader.onerror = () => reject(new Error("文件读取失败"));
            reader.readAsDataURL(file);
          });
        },

        // 应用背景（核心样式修改）
        applyBackground() {
          document.body.classList.remove("has-pic");
          // 释放旧的 Blob URL（如果有）
          if (this.currentBlobUrl) {
            URL.revokeObjectURL(this.currentBlobUrl);
            this.currentBlobUrl = null;
          }

          if (this.mode === "bing") {
            document.body.style.background = "none";
            document.body.style.backgroundImage =
              'url("https://api.dujin.org/bing/1920.php")';
            document.body.classList.add("has-pic");
            document.body.style.backgroundPosition = "center";
            document.body.style.backgroundRepeat = "no-repeat";
            document.body.style.backgroundSize = "cover";
          } else if (this.mode === "local") {
            const localData = Store.get("ntpBgLocalData", "");
            if (localData && localData.startsWith("data:image")) {
              document.body.style.background = "none";
              document.body.style.backgroundImage = `url('${localData}')`;
              document.body.classList.add("has-pic");
              document.body.style.backgroundPosition = "center";
              document.body.style.backgroundRepeat = "no-repeat";
              document.body.style.backgroundSize = "cover";
            } else {
              // 无效数据，回退到第一个预设
              this.mode = this.presets[0].id;
              Store.set("ntpBgMode", this.mode);
              this.applyBackground();
            }
          } else {
            const preset =
              this.presets.find((p) => p.id === this.mode) || this.presets[0];
            document.body.style.backgroundImage = "none";
            document.body.style.background = preset.bg;
            if (preset.isPic) document.body.classList.add("has-pic");
          }
        },

        // 同步UI状态（单选框、预设圆圈、上传按钮显隐）
        syncUI() {
          const isBing = this.mode === "bing";
          const isLocal = this.mode === "local";
          const isPreset =
            this.mode.startsWith("grad-") || this.mode.startsWith("solid-");

          this.radios.forEach((r) => {
            if (r.value === "bing") r.checked = isBing;
            if (r.value === "local") {
              r.checked = isLocal;
              if (isLocal) this.uploadBtn.classList.remove("hidden");
              else this.uploadBtn.classList.add("hidden");
            }
          });

          $$(".preset-circle").forEach((el) => {
            if (isPreset && el.dataset.id === this.mode) {
              el.classList.add(
                "ring-2",
                "ring-offset-2",
                "scale-110",
                "preset-ring",
              );
              el.classList.remove("opacity-60");
            } else {
              el.classList.remove(
                "ring-2",
                "ring-offset-2",
                "scale-110",
                "preset-ring",
              );
              el.classList.add("opacity-60");
            }
          });
        },

        // 渲染预设颜色圆圈
        renderPresets() {
          this.presetContainer.innerHTML = "";
          this.presets.forEach((p) => {
            const btn = document.createElement("button");
            btn.className = `preset-circle w-[36px] h-[36px] rounded-full shadow border border-black/5 dark:border-white/10 transition-all duration-300 opacity-60 hover:opacity-100 ring-blue-500 hover:scale-105`;
            btn.style.background = p.bg;
            btn.dataset.id = p.id;
            btn.onclick = () => {
              this.mode = p.id;
              Store.set("ntpBgMode", this.mode);
              this.applyBackground();
              this.syncUI();
            };
            this.presetContainer.appendChild(btn);
          });
        },

        // 事件绑定（含本地图片上传压缩存储）
        bindEvents() {
          this.btn.addEventListener("click", () => {
            this.modal.classList.remove("hidden");
            requestAnimationFrame(() =>
              this.modal.children[0].classList.remove("scale-95", "opacity-0"),
            );
          });

          $("#closeSettings").addEventListener("click", () => {
            this.modal.children[0].classList.add("scale-95", "opacity-0");
            setTimeout(() => this.modal.classList.add("hidden"), 300);
          });

          this.modal.addEventListener("click", (e) => {
            if (e.target === this.modal) $("#closeSettings").click();
          });

          this.radios.forEach((r) => {
            r.addEventListener("change", (e) => {
              if (e.target.checked) {
                if (e.target.value === "bing") {
                  this.mode = "bing";
                  Store.set("ntpBgMode", this.mode);
                  this.applyBackground();
                  this.syncUI();
                } else if (e.target.value === "local") {
                  this.mode = "local";
                  Store.set("ntpBgMode", this.mode);
                  const curData = Store.get("ntpBgLocalData", "");
                  if (!curData) {
                    this.hiddenFileInput.click(); // 无本地图则主动触发上传
                  } else {
                    this.applyBackground();
                    this.syncUI();
                  }
                }
              }
            });
          });

          this.uploadBtn.addEventListener("click", () =>
            this.hiddenFileInput.click(),
          );

          this.hiddenFileInput.addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // 大小预警（原始文件超过 5MB 给出建议）
            const rawSizeMB = file.size / (1024 * 1024);
            if (rawSizeMB > 5) {
              if (
                !confirm(
                  `图片原始大小 ${rawSizeMB.toFixed(1)}MB，压缩后仍可能过大。是否继续？`,
                )
              ) {
                this.hiddenFileInput.value = "";
                return;
              }
            }

            try {
              // 显示加载提示
              const originalText = this.uploadBtn.innerText;
              this.uploadBtn.innerText = "压缩中...";
              this.uploadBtn.disabled = true;

              const compressedBase64 = await this.compressImage(file);
              const compressedSizeKB = (compressedBase64.length * 0.75) / 1024; // 估算
              if (compressedSizeKB > 800) {
                alert(
                  `压缩后图片仍较大（约 ${compressedSizeKB.toFixed(0)}KB），为保障存储性能，建议选用更小图片。`,
                );
                this.uploadBtn.innerText = originalText;
                this.uploadBtn.disabled = false;
                this.hiddenFileInput.value = "";
                return;
              }

              Store.set("ntpBgLocalData", compressedBase64);
              this.mode = "local";
              Store.set("ntpBgMode", "local");
              this.applyBackground();
              this.syncUI();

              this.uploadBtn.innerText = originalText;
              this.uploadBtn.disabled = false;
            } catch (err) {
              alert("壁纸处理失败：" + err.message);
              this.uploadBtn.innerText = "浏览系统目录...";
              this.uploadBtn.disabled = false;
            } finally {
              this.hiddenFileInput.value = ""; // 清空，允许重复上传同一文件
            }
          });
        },
      };

      // 全系统启动
      document.addEventListener("DOMContentLoaded", () => {
        ThemeModule.init();
        BgModule.init();
        TimeModule.init();
        SearchModule.init();
        WeatherModule.init();
        ShortcutModule.init();
        window.ShortcutModule = ShortcutModule;
      });
    </script>
  </body>
</html>
